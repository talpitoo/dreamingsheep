name: Deploy to production

# Mirrors the previous .gitlab-ci.yml deploy job: SSHes into the EC2 instance,
# pulls latest code, builds, and restarts the Next.js app via nohup.

on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Auto-trigger on semver tag push (e.g. v3.1.2)
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # NOTE: these two are pinned to the first releases that run on node24
      # (actions declare their own runtime in action.yml; node20 is deprecated on
      # GitHub runners). Nothing else changed in either release.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
            set -e
            source ~/.nvm/nvm.sh

            # NOTE: fetch + reset --hard, NOT `git pull`. Next rewrites next-env.d.ts on
            # every run and dev/build disagree about line 3 (`.next/dev/types/routes.d.ts`
            # vs `.next/types/routes.d.ts`), so after each build the box has a dirty tree
            # and `git pull` aborts with "local changes would be overwritten". Nothing on
            # this box is ever edited by hand, so the remote is always the truth.
            echo 'Git pull code...'
            cd /home/ubuntu/dreamingsheep
            git fetch --all --tags
            git checkout main
            git reset --hard origin/main

            # the app keeps serving until here: anything that fails above (network, git,
            # yarn) now leaves the site up instead of dead behind a maintenance page
            echo 'Building dreamingsheep...'
            nvm use 22
            npm install -g yarn
            yarn install

            echo 'Killing processes...'
            pkill -f next || true
            pkill -f nest || true
            pkill -f node || true
            sleep 2

            rm -rf .next
            yarn build
            cp public/assets/title-dreamingsheep.png public/assets/sheep-dreamingsheep.png .next/static/media/

            echo 'Starting dreamingsheep...'
            nohup bash -c 'cd ~/dreamingsheep && source ~/.nvm/nvm.sh && nvm use 22 && yarn start' > ~/dreamingsheep/nohup.out 2>&1 &
            disown -a

            echo 'Deploy complete!'
          EOF
