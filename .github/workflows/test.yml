name: Tests

# Lint, type-check and unit tests on every PR and push to main.
# Unit tests cover pure helpers and zod schemas only — no database needed.
# The puppeteer E2E suite (`yarn test:e2e`) is local-only for now: it requires
# a running dev server and a seeded Postgres (see test/e2e/helpers.ts).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint, types & unit tests
    # NOTE: pinned, not ubuntu-latest. GitHub moved that label from Ubuntu 24.04 to 26.04
    # (rollout 2026-10-19..11-19), whose OpenSSL 3.5 the frozen Prisma 3.13 has no engine
    # for ("Unknown binaryTarget debian-openssl-3.5.x"). 24.04 ships OpenSSL 3.0.x, the
    # same target as the production box. Lift the pin only together with a Prisma bump.
    runs-on: ubuntu-24.04

    steps:
      # NOTE: pinned to the first releases that run on node24 (actions declare their
      # own runtime in action.yml; node20 is deprecated on GitHub runners). setup-node
      # v5 auto-caches when package.json has a `packageManager` field — ours has none,
      # and `cache: yarn` below stays explicit either way.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn type:check

      - name: Unit tests
        run: yarn test
